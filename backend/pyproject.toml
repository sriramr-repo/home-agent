[project]
name = "muse-agent-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "langgraph>=0.2",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.1",
  
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["api*", "agent*", "tools*", "memory*", "db*"]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]